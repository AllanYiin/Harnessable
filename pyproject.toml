[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessable"
version = "0.1.0"
description = "A provider-neutral Harness Engineering control plane for chat, agent, and multi-agent runtimes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harnessable = "harnessable.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harnessable = ["console/static/*", "builtins/rules/*.yaml", "builtins/fallback/*.yaml", "builtins/evals/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
